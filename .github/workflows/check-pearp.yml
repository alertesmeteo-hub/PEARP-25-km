name: Vérifier accès PEARP 0.25
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/check_access.py'
      - '.github/workflows/check-pearp.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier catalogue et métadonnées
        env:
          METEOFRANCE_PEARP_25_API_KEY: ${{ secrets.METEOFRANCE_PEARP_25_API_KEY }}
        run: python scripts/check_access.py
      - uses: actions/upload-artifact@v4
        with:
          name: pearp-metadata
          path: build/metadata/
          if-no-files-found: error
